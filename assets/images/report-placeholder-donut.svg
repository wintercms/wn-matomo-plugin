<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 360"
  preserveAspectRatio="xMidYMid meet" fill="none"
    role="img" aria-labelledby="title desc">
  <title id="title">Donut chart placeholder</title>
  <desc id="desc">Donut chart skeleton displayed while report data loads.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#f6f8fa"/>
      <stop offset="100%" stop-color="#ecf2f600"/>
    </linearGradient>
    <linearGradient id="shimmer" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#dbe4ea"/>
      <stop offset="50%" stop-color="#f6f9fb"/>
      <stop offset="100%" stop-color="#dbe4ea"/>
      <animateTransform attributeName="gradientTransform" type="translate" values="-1 0;1 0;-1 0" dur="1.6s" repeatCount="indefinite"/>
    </linearGradient>
  </defs>
  <rect width="960" height="360" rx="12" fill="url(#bg)"/>

  <circle cx="268" cy="180" r="104" fill="none" stroke="#d2dfe7" stroke-width="42"/>
  <circle cx="268" cy="180" r="104" fill="none" stroke="#9dc2d6" stroke-width="42" stroke-dasharray="215 439" stroke-linecap="round" transform="rotate(-90 268 180)"/>
  <circle cx="268" cy="180" r="104" fill="none" stroke="#b7d2e1" stroke-width="42" stroke-dasharray="134 520" stroke-linecap="round" transform="rotate(38 268 180)"/>

  <g>
    <rect x="468" y="98" width="396" height="20" rx="8" fill="url(#shimmer)"/>
    <rect x="468" y="132" width="330" height="20" rx="8" fill="#d4dfe7"/>
    <rect x="468" y="166" width="360" height="20" rx="8" fill="#dbe4ea"/>
    <rect x="468" y="200" width="280" height="20" rx="8" fill="#d4dfe7"/>
    <rect x="468" y="234" width="342" height="20" rx="8" fill="#dbe4ea"/>
    <rect x="468" y="268" width="304" height="20" rx="8" fill="#d4dfe7"/>
  </g>
</svg>
