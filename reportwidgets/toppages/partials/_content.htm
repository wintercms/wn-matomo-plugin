<div class="matomo-report-widget-body">
    <?php if (!empty($error)): ?>
        <div class="callout callout-warning">
            <div class="content"><?= e($error) ?></div>
        </div>
    <?php else: ?>
        <div class="control-list">
            <div class="matomo-top-pages-table-wrapper" style="--max-pages:<?= e((string) ($selectedLimit ?? '10')) ?>;">
            <table class="table data matomo-top-pages-table">
                <thead>
                    <tr>
                        <th class="matomo-top-pages-header matomo-top-pages-header-url"><?= e(trans('winter.matomo::lang.reportwidgets.top_pages.columns.url')) ?></th>
                        <th class="matomo-top-pages-header matomo-top-pages-header-metric matomo-top-pages-header-visits"><?= e(trans('winter.matomo::lang.reportwidgets.top_pages.columns.nb_visits')) ?></th>
                        <th class="matomo-top-pages-header matomo-top-pages-header-metric matomo-top-pages-header-bounce"><?= e(trans('winter.matomo::lang.reportwidgets.top_pages.columns.bounce_rate')) ?></th>
                        <th class="matomo-top-pages-header matomo-top-pages-header-metric matomo-top-pages-header-time"><?= e(trans('winter.matomo::lang.reportwidgets.top_pages.columns.avg_time_on_site')) ?></th>
                    </tr>
                </thead>
                <tbody>
                    <?php if (empty($pages)): ?>
                        <tr>
                            <td colspan="4" class="text-center text-muted">
                                <?= e(trans('winter.matomo::lang.reportwidgets.top_pages.no_data')) ?>
                            </td>
                        </tr>
                    <?php else: ?>
                        <?php if (($selectedViewMode ?? 'flat') === 'hierarchical'): ?>
                            <?= $this->renderHierarchicalRows($pages) ?>
                        <?php else: ?>
                            <?php foreach ($pages as $page): ?>
                                <tr>
                                    <td class="matomo-top-pages-url-cell">
                                        <span title="<?= e($page['url']) ?>">
                                            <?= e($page['url']) ?>
                                        </span>
                                    </td>
                                    <td class="matomo-sticky-metric matomo-sticky-metric-visits"><?= e(number_format($page['nb_visits'])) ?></td>
                                    <td class="matomo-sticky-metric matomo-sticky-metric-bounce"><?= e($page['bounce_rate']) ?></td>
                                    <td class="matomo-sticky-metric matomo-sticky-metric-time"><?= e($page['avg_time_on_site']) ?></td>
                                </tr>
                            <?php endforeach ?>
                        <?php endif ?>
                    <?php endif ?>
                </tbody>
            </table>
            </div>
        </div>
    <?php endif ?>

    <div class="matomo-report-widget-footer">
        <?= $widgetMeta ?? '' ?>

        <div class="matomo-report-widget-actions">
            <?= $refreshButton ?? '' ?>
        </div>
    </div>

</div>
